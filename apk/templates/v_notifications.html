<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <style>
        /* Basic styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .notification-list {
            list-style: none;
            padding: 0;
        }

        .notification-item {
            background-color: #f9f9f9;
            margin: 10px 0;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .notification-header h2 {
            font-size: 1.2em;
            color: #333;
        }

        .notification-date {
            font-size: 0.9em;
            color: #777;
        }

        .notification-message {
            font-size: 1em;
            color: #555;
        }

        .btn-detail {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            text-align: center;
        }

        .btn-detail:hover {
            background-color: #0056b3;
        }

        /* Add responsiveness */
        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }

            .notification-header h2 {
                font-size: 1.1em;
            }

            .notification-date {
                font-size: 0.8em;
            }

            .notification-message {
                font-size: 0.9em;
            }

            .btn-detail {
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Notifications</h1>
        <ul class="notification-list">
            {% for notification in v_notifications %}
            <li class="notification-item">
                <div class="notification-header">
                    <h2>Name: {{ notification.name }}</h2>
                    <p class="notification-date">{{ notification.created_at }}</p>
                </div>
                <p class="notification-message">Message: {{ notification.v_message|slice:":100" }}...</p>
                <a href="{%url 'detail' notification.id %}" class="btn-detail">Detail</a>
            </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
