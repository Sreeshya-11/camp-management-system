<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Notification</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-100 to-indigo-200 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-lg">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">📢 Send a Notification</h2>

        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-gray-700 font-semibold mb-2">Message</label>
                <textarea name="message" required class="w-full p-4 border border-gray-300 rounded-lg focus:ring focus:ring-indigo-300 focus:border-indigo-500 transition" rows="5" placeholder="Type your message here..."></textarea>
            </div>
            <button type="submit" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3 rounded-lg transition transform hover:scale-105">🚀 Send Notification</button>
        </form>

        <a href="/chome/" class="block text-center text-indigo-500 font-semibold mt-5 hover:underline hover:text-indigo-700 transition">⬅ Back to Home</a>
    </div>

</body>
</html>
