<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camp List</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@^2.2/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <header class="bg-blue-600 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-3xl font-bold">Camp Management</h1>
            <div class="flex space-x-4">
                <!-- Add New Camp Link -->
                {% comment %} <a href="{% url 'camp' %}" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-lg">
                    Add New Camp
                </a> {% endcomment %}
                <!-- Back to Home Link -->
                <a href="{% url 'home' %}" class="bg-blue-500 hover:bg-gray-600 text-white py-2 px-4 rounded-lg">
                    Back to Home
                </a>
            </div>
        </div>
    </header>
    <main class="container mx-auto p-6">
        <h2 class="text-2xl font-bold mb-6">Camp List</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            {% for camp in camps %}
                <div class="bg-white rounded-lg shadow-md p-6 flex flex-col">
                    <h3 class="text-xl font-semibold mb-2">{{ camp.name }}</h3>
                    <p class="text-gray-700 mb-4">{{ camp.location }}</p>
                    <p class="text-gray-500 mb-4">{{ camp.contact_information }}</p>
                    <p class="text-gray-500 mb-4">{{ camp.needs }}</p>
                    <div class="mt-auto flex space-x-2">
                    </div>
                </div>
            {% endfor %}
        </div>
    </main>
</body>
</html>
