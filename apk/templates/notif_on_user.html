<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Notifications</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">

    <div class="container mx-auto mt-10">
        <h1 class="text-3xl font-bold mb-6">User  Notifications</h1>

        <div class="bg-white shadow-md rounded-lg p-6">
            {% if n %}
                <ul class="space-y-4">
                    {% for notification in n %}
                        <li class="p-4 border border-gray-200 rounded-lg hover:bg-gray-50 transition">
                            <h2 class="text-xl font-semibold">{{ notification.title }}</h2>
                            <p class="text-gray-600">{{ notification.message }}</p>
                            <p class="text-sm text-gray-500">{{ notification.created_at|date:"F j, Y, g:i a" }}</p>
                        </li>
                    {% endfor %}
                </ul>
            {% else %}
                <p class="text-gray-500">No notifications available.</p>
            {% endif %}
        </div>
    </div>

</body>
</html>
