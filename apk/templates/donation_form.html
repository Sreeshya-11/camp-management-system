<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin: 10px 0 5px;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border: none;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Donate to a Camp</h1>

        <form id="donation-form">
            {% csrf_token %}
            <!-- Fallback if needs is not present, using 'MISSING' for missing needs -->
            <input type="hidden" id="needs_id" value="{{ needs.id|default_if_none:'MISSING' }}">
            <input type="hidden" id="donor_id" value="{% if request.user.is_authenticated %}{{ request.user.id }}{% else %}Anonymous{% endif %}">

            <label for="amount">Enter Amount (INR):</label>
            <input type="number" id="amount" name="amount" required placeholder="Enter donation amount" min="1">

            <label for="camp">Select Camp:</label>
            <select id="camp" name="camp" required>
                <option value="">Select a Camp</option>
                {% for camp in camps %}
                    <option value="{{ camp.id }}">{{ camp.name }}</option>
                {% endfor %}
            </select>

            <button type="submit" id="pay-button">Pay</button>
        </form>
    </div>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        document.getElementById('donation-form').onsubmit = function (e) {
            e.preventDefault();

            let needsId = document.getElementById('needs_id').value.trim();
            let amount = document.getElementById('amount').value.trim();
            let campId = document.getElementById('camp').value.trim();
            let donorId = document.getElementById('donor_id').value.trim();
            let csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

            if (!needsId || needsId === 'MISSING') {
                alert('Needs ID is missing. Please contact support.');
                return;
            }

            if (!amount || amount <= 0) {
                alert('Please enter a valid donation amount.');
                return;
            }
            if (!campId) {
                alert('Please select a camp.');
                return;
            }
            if (!donorId) {
                alert('Donor ID is missing.');
                return;
            }

            fetch(`/payment_form1/${campId}/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                credentials: 'include',
                body: JSON.stringify({ donor_id: donorId, needs_id: needsId, amount: amount })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert("Error: " + data.error);
                    return;
                }

                let options = {
                    key: data.razorpay_key_id,
                    amount: data.amount * 100,
                    currency: "INR",
                    name: "Donation",
                    description: "Support our cause",
                    order_id: data.order_id,
                    handler: function (response) {
                        verifyPayment(response.razorpay_payment_id, response.razorpay_order_id, response.razorpay_signature);
                    },
                    prefill: {
                        name: "{{ request.user.first_name }}",
                        email: "{{ request.user.email }}",
                        contact: "9999999999"
                    },
                    theme: {
                        color: "#3399cc"
                    }
                };

                let rzp1 = new Razorpay(options);
                rzp1.open();
            })
            .catch(error => {
                console.error("Fetch API Error:", error);
                alert("An error occurred while initiating the payment.");
            });
        };

        function verifyPayment(paymentId, orderId, signature) {
            fetch('/confirm_payment1/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                },
                credentials: 'include',
                body: JSON.stringify({
                    razorpay_payment_id: paymentId,
                    razorpay_order_id: orderId,
                    razorpay_signature: signature
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Payment successfully verified');
                } else {
                    alert('Payment verification failed');
                }
            })
            .catch(error => {
                console.error('Verification Error:', error);
                alert('An error occurred while verifying the payment.');
            });
        }
    </script>
</body>
</html>
