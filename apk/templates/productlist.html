
   <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-6">
        <h1 class="text-3xl font-bold mb-6 text-center text-gray-800">Product List</h1>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            {% for product in prod %}
                <div class="bg-white p-6 rounded-lg shadow-lg hover:shadow-xl transition-shadow duration-300">
                    <h1 class="text-xl font-semibold text-gray-700">{{ product.productname }}</h1>
                    <h5 class="text-xl font-semibold text-gray-700">{{ product.brand }}</h5>
                    <p class="text-gray-500 mt-2">{{ product.description }}</p> <!-- Adjust according to your model fields -->
                    <p class="text-gray-900 font-bold mt-4">${{ product.price }}</p>
                    <img src="{{ product.image.url }}"></img>
                    <a href="#" class="mt-4 inline-block bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors duration-300">View Details</a>
                    <a href="/delproduct/{{ product.id }}" class="mt-4 inline-block bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors duration-300">Delete</a>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
