<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camp Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 flex justify-center items-center h-screen">

    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-96">
        <h2 class="text-2xl font-bold text-white text-center">Camp Login</h2>

        {% if error_msg %}
            <p class="text-red-500 text-sm text-center mt-2">{{ error_msg }}</p>
        {% endif %}

        <form action="{% url 'clogin' %}" method="POST" class="mt-4">
            {% csrf_token %}

            <div class="mb-4">
                <label for="email" class="text-gray-300 block mb-1">Email</label>
                <input type="email" id="email" name="email" required 
                    class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white border border-gray-600 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div class="mb-4">
                <label for="password" class="text-gray-300 block mb-1">Password</label>
                <input type="password" id="password" name="password" required 
                    class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white border border-gray-600 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 rounded-lg font-semibold">Login</button>

            <p class="text-sm text-gray-400 text-center mt-3">
                <a href="/fpwd_camp/" class="text-blue-400 hover:underline">Forgot Password?</a>
            </p>
        </form>

        <p class="text-sm text-gray-400 text-center mt-4">
            Don't have an account? <a href="{% url 'camp' %}" class="text-blue-400 hover:underline">Register</a>
        </p>
    </div>

</body>
</html>
