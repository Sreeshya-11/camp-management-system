<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Report</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@^2.2/dist/tailwind.min.css" rel="stylesheet">
    <!-- Heroicons CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/heroicons/2.0.18/heroicons.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl overflow-hidden">
        <!-- Form Header -->
        <div class="bg-blue-600 p-6">
            <div class="flex items-center space-x-3">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
                <h1 class="text-2xl font-bold text-white">Create New Report</h1>
            </div>
        </div>

        <!-- Form Body -->
        <form method="post" enctype="multipart/form-data" class="p-8 space-y-6">
            {% csrf_token %}
            
            <!-- Report Type -->
            <div class="relative group">
                <label class="block text-sm font-medium text-gray-700 mb-2">Report Type</label>
                <div class="relative">
                    <select name="report_type" class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none appearance-none">
                        <option value="damage">Damage Report</option>
                        <option value="needs">Needs Assessment</option>
                    </select>
                    <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l4-4 4 4m0 6l-4 4-4-4"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Location -->
            <div class="relative">
                <input type="text" id="location" name="location" required
                    class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg peer focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none"
                    placeholder=" ">
                <label for="location" 
                    class="absolute left-4 top-3 px-1 text-gray-500 transition-all duration-200 
                           peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-3
                           peer-focus:-top-2 peer-focus:text-blue-600 peer-focus:bg-white 
                           peer-focus:text-sm bg-white -top-2 text-sm">
                    Location
                </label>
            </div>

            <!-- Description -->
            <div class="relative">
                <textarea id="description" name="description" rows="4" required
                    class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg peer focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none"
                    placeholder=" "></textarea>
                <label for="description" 
                    class="absolute left-4 top-3 px-1 text-gray-500 transition-all duration-200 
                           peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-3
                           peer-focus:-top-2 peer-focus:text-blue-600 peer-focus:bg-white 
                           peer-focus:text-sm bg-white -top-2 text-sm">
                    Description
                </label>
            </div>

            <!-- File Upload -->
            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">Upload Photo</label>
                <div class="flex items-center justify-center w-full">
                    <label class="flex flex-col w-full h-32 border-4 border-dashed hover:border-gray-300 hover:bg-gray-100 transition-all rounded-lg cursor-pointer">
                        <div class="flex flex-col items-center justify-center pt-7">
                            <svg class="w-12 h-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                            </svg>
                            <p class="pt-1 text-sm text-gray-600">Click to upload a photo</p>
                        </div>
                        <input type="file" name="photo" class="opacity-0" />
                    </label>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" 
                class="w-full py-3 px-6 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transition-all duration-200 flex items-center justify-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Submit Report
            </button>
        </form>
    </div>
</body>
</html>
