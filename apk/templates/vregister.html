<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-gray-700 mb-6">Volunteer Registration</h2>

        <form method="post" onsubmit="return validateForm()">
            {% csrf_token %}

            <div class="mb-4">
                <label class="block text-gray-700 font-medium">Email</label>
                <input type="email" name="email" id="email" required class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-300">
                <p class="error-text text-red-500 text-sm mt-1 hidden" id="emailError">Enter a valid email.</p>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-medium">Username</label>
                <input type="text" name="username" id="username" required class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-300">
                <p class="error-text text-red-500 text-sm mt-1 hidden" id="usernameError">Username is required.</p>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-medium">Password</label>
                <input type="password" name="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-300">
                <p class="error-text text-red-500 text-sm mt-1 hidden" id="passwordError">Password must be at least 6 characters.</p>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-medium">Phone</label>
                <input type="text" name="phone" id="phone" required maxlength="10" class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-300">
                <p class="error-text text-red-500 text-sm mt-1 hidden" id="phoneError">Phone number must be 10 digits.</p>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-medium">Aadhaar Number</label>
                <input type="text" name="Aadhaar_No" id="aadhaar" required maxlength="12" class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-300">
                <p class="error-text text-red-500 text-sm mt-1 hidden" id="aadhaarError">Aadhaar must be 12 digits.</p>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-medium">Gender</label>
                <div class="flex space-x-4">
                    <label><input type="radio" name="gender" value="Male" required> Male</label>
                    <label><input type="radio" name="gender" value="Female" required> Female</label>
                    <label><input type="radio" name="gender" value="Other" required> Other</label>
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-medium">Age</label>
                <input type="number" name="age" id="age" required class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-300">
                <p class="error-text text-red-500 text-sm mt-1 hidden" id="ageError">Age must be between 18 and 100.</p>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-medium">Skills</label>
                <div class="grid grid-cols-2 gap-2">
                    <label><input type="checkbox" name="skills" value="communication"> Communication</label>
                    <label><input type="checkbox" name="skills" value="firstaid"> First Aid</label>
                    <label><input type="checkbox" name="skills" value="physical fitness"> Physical Fitness</label>
                    <label><input type="checkbox" name="skills" value="technology skills"> Technology Skills</label>
                    <label><input type="checkbox" name="skills" value="organizing skills"> Organizing Skills</label>
                    <label>
                        <input type="checkbox" id="other-skills" onclick="toggleSkillInput()"> Other
                    </label>
                </div>
                <textarea id="other-skills-text" name="skills" placeholder="Please specify..." class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-300 mt-2 hidden"></textarea>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-medium">Location</label>
                <input type="text" name="location" id="location" required class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-300">
            </div>

            <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 rounded-lg transition">Register</button>
        </form>
    </div>

    <script>
        function toggleSkillInput() {
            document.getElementById('other-skills-text').classList.toggle('hidden');
        }

        function validateForm() {
            let isValid = true;

            function showError(id, message) {
                document.getElementById(id).classList.remove("hidden");
                document.getElementById(id).textContent = message;
                isValid = false;
            }

            function hideError(id) {
                document.getElementById(id).classList.add("hidden");
            }

            const email = document.getElementById("email").value.trim();
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const aadhaar = document.getElementById("aadhaar").value.trim();
            const age = document.getElementById("age").value.trim();

            if (!/^\S+@\S+\.\S+$/.test(email)) showError("emailError", "Enter a valid email"); else hideError("emailError");
            if (username === "") showError("usernameError", "Username is required"); else hideError("usernameError");
            if (password.length < 6) showError("passwordError", "Password must be at least 6 characters"); else hideError("passwordError");
            if (!/^\d{10}$/.test(phone)) showError("phoneError", "Phone number must be 10 digits"); else hideError("phoneError");
            if (!/^\d{12}$/.test(aadhaar)) showError("aadhaarError", "Aadhaar must be 12 digits"); else hideError("aadhaarError");
            if (age < 18 || age > 100) showError("ageError", "Age must be between 18 and 100"); else hideError("ageError");

            return isValid;
        }
    </script>

</body>
</html>
