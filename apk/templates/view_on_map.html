<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View on Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex flex-col items-center p-6">
    <h2 class="text-3xl font-bold mb-4">Report Location</h2>
    <div id="map" class="w-full max-w-3xl h-96 rounded-lg shadow-lg"></div>

    <script>
        var latitude = {{ latitude|default:'null' }};
        var longitude = {{ longitude|default:'null' }};
        
        if (latitude !== null && longitude !== null) {
            var map = L.map('map').setView([latitude, longitude], 13);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            L.marker([latitude, longitude]).addTo(map)
                .bindPopup("{{ report.location }}")
                .openPopup();
        } else {
            document.getElementById("map").innerHTML = "<p class='text-red-500 text-lg text-center mt-6'>Location not found!</p>";
        }
    </script>
</body>
</html>
