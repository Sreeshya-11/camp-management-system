<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Login</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://unpkg.com/heroicons@1.0.6/outline/heroicons.min.js"></script>
</head>
<body class="bg-gray-100">
    <div class="flex items-center justify-center min-h-screen">
        <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
            <h2 class="text-2xl font-bold text-center text-gray-700 mb-6">Volunteer Login</h2>
            {% if messages %}
                <div class="bg-red-500 text-white p-3 rounded mb-4">
                    <ul>
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                    </ul>
                </div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-4">
                    <label for="email" class="block text-gray-700 font-medium mb-2">Email</label>
                    <div class="flex items-center border border-gray-300 rounded">
                        <input type="text" id="email" name="email" required class="flex-grow px-4 py-2 focus:outline-none focus:ring focus:border-blue-500" placeholder="Enter your email">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12H8m0 0V8m8 4v4m-8 0h8" />
                        </svg>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="block text-gray-700 font-medium mb-2">Password</label>
                    <div class="flex items-center border border-gray-300 rounded">
                        <input type="password" id="password" name="password" required class="flex-grow px-4 py-2 focus:outline-none focus:ring focus:border-blue-500" placeholder="Enter your password">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 12v9m0 0V12m0 9h9m-9 0H3" />
                        </svg>
                    </div>
                </div>
                <a href="{% url 'forgot_pwd_vol' %}" class="text-blue-500 hover:underline">Forgot password?</a>
                <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 rounded focus:outline-none focus:ring focus:ring-blue-300 transition duration-200">Login</button>
            </form>
            <p class="mt-4 text-center text-gray-600">
                Don't have an account? <a href="{% url 'vregister' %}" class="text-blue-500 hover:underline">Register here</a>
            </p>
        </div>
    </div>
</body>
</html>
