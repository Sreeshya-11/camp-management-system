<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-semibold mb-4">Notifications</h1>
        <div class="space-y-4">
            {% for notification in notifications %}
            <div class="bg-white p-4 shadow rounded-lg border-l-4 {% if notification.is_read %}border-green-500{% else %}border-blue-500{% endif %}">
                <p class="text-gray-800 font-semibold">{{ notification.name }}</p>
                <p class="text-gray-600 text-sm">{{ notification.email }}</p>
                <p class="text-gray-700 mt-2">{{ notification.v_message }}</p>
                <p class="text-xs text-gray-500 mt-2">{{ notification.created_at }}</p>
                <a href="{% url 'apply' %}" class="mt-3 inline-block px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">Apply</a>
            </div>
            {% empty %}
            <p class="text-gray-500">No notifications available.</p>
            {% endfor %}
        </div>
    </div>
    <div class="flex space-x-4">
        <a href="{% url 'chome' %}" class="bg-blue-500 hover:bg-gray-600 text-white py-2 px-4 rounded-lg">
            Back to Home
        </a>
    </div>
</body>
</html>
