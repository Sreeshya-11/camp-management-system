<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-white shadow-lg rounded-lg p-6">
        <h2 class="text-2xl font-semibold text-center mb-4">Register</h2>

        <form action="" method="POST" enctype="multipart/form-data" onsubmit="return validateForm()">
            {% csrf_token %}

            <div class="mb-3">
                <label class="block text-sm font-medium">Username</label>
                <input type="text" name="username" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
            </div>

            <div class="mb-3">
                <label class="block text-sm font-medium">Email</label>
                <input type="email" name="email" id="email" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
                <p id="emailError" class="text-red-500 text-sm hidden">Invalid email</p>
            </div>

            <div class="mb-3">
                <label class="block text-sm font-medium">Password</label>
                <input type="password" name="password" id="password" minlength="6" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
                <p id="passwordError" class="text-red-500 text-sm hidden">Must be at least 6 characters</p>
            </div>

            <div class="mb-3">
                <label class="block text-sm font-medium">Location</label>
                <input type="text" name="location" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
            </div>

            <div class="mb-3">
                <label class="block text-sm font-medium">Aadhaar Number</label>
                <input type="text" name="Aadhaar_No" id="aadhaar" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required maxlength="12" oninput="restrictDigits(this, 12)">
                <p id="aadhaarError" class="text-red-500 text-sm hidden">Aadhaar must be exactly 12 digits</p>
            </div>

            <div class="mb-3">
                <label class="block text-sm font-medium">Phone</label>
                <input type="text" name="phone" id="phone" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required maxlength="10" oninput="restrictDigits(this, 10)">
                <p id="phoneError" class="text-red-500 text-sm hidden">Phone must be exactly 10 digits</p>
            </div>

            <div class="mb-3">
                <label class="block text-sm font-medium">Ward No</label>
                <input type="text" name="Ward_No" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
            </div>

            <div class="mb-3">
                <label class="block text-sm font-medium">Profile Picture</label>
                <input type="file" name="profilepic" class="w-full p-2 border rounded-lg">
            </div>

            <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600">Register</button>
        </form>
    </div>

    <script>
        function restrictDigits(input, maxLength) {
            input.value = input.value.replace(/\D/g, ''); // Remove non-numeric characters
            if (input.value.length > maxLength) {
                input.value = input.value.slice(0, maxLength); // Restrict length
            }
        }

        function validateForm() {
            let isValid = true;

            let email = document.getElementById("email").value;
            let emailError = document.getElementById("emailError");
            if (!email.match(/^[^@]+@[^@]+\.[a-zA-Z]{2,}$/)) {
                emailError.classList.remove("hidden");
                isValid = false;
            } else {
                emailError.classList.add("hidden");
            }

            let password = document.getElementById("password").value;
            let passwordError = document.getElementById("passwordError");
            if (password.length < 6) {
                passwordError.classList.remove("hidden");
                isValid = false;
            } else {
                passwordError.classList.add("hidden");
            }

            let aadhaar = document.getElementById("aadhaar").value;
            let aadhaarError = document.getElementById("aadhaarError");
            if (aadhaar.length !== 12) {
                aadhaarError.classList.remove("hidden");
                isValid = false;
            } else {
                aadhaarError.classList.add("hidden");
            }

            let phone = document.getElementById("phone").value;
            let phoneError = document.getElementById("phoneError");
            if (phone.length !== 10) {
                phoneError.classList.remove("hidden");
                isValid = false;
            } else {
                phoneError.classList.add("hidden");
            }

            return isValid;
        }
    </script>

</body>
</html>
