<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camp Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-lg">
        <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">Camp Registration</h2>

        {% if messages %}
            <div class="mb-4">
                {% for message in messages %}
                    <p class="text-red-500">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form action="{% url 'camp' %}" method="POST" class="space-y-4" onsubmit="return validateForm()">
            {% csrf_token %}
            
            <div>
                <label class="block font-medium text-gray-700">Camp Name</label>
                <input type="text" name="name" required class="w-full p-2 border rounded-lg focus:ring focus:ring-blue-300">
            </div>

            <div>
                <label class="block font-medium text-gray-700">Email</label>
                <input type="email" name="email" required class="w-full p-2 border rounded-lg focus:ring focus:ring-blue-300">
            </div>

            <div>
                <label class="block font-medium text-gray-700">Password</label>
                <input type="text" name="password" required class="w-full p-2 border rounded-lg focus:ring focus:ring-blue-300">
            </div>

            <div>
                <label class="block font-medium text-gray-700">Location</label>
                <input type="text" name="location" required class="w-full p-2 border rounded-lg focus:ring focus:ring-blue-300">
            </div>

            <div>
                <label class="block font-medium text-gray-700">Contact Number</label>
                <input type="text" name="contact_information" id="contact_information" required 
                    maxlength="10" pattern="\d{10}" 
                    title="Phone number must be exactly 10 digits" 
                    oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10)" 
                    class="w-full p-2 border rounded-lg focus:ring focus:ring-blue-300">
            </div>

            <div>
                <label class="block font-medium text-gray-700">Facilities</label>
                <textarea name="Facilities" required class="w-full p-2 border rounded-lg focus:ring focus:ring-blue-300"></textarea>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                Register
            </button>
        </form>

        <p class="mt-4 text-center text-gray-600">
            Already have an account? 
            <a href="{% url 'clogin' %}" class="text-blue-600 hover:underline">Login</a>
        </p>
    </div>

    <script>
        function validateForm() {
            let contactInfo = document.getElementById("contact_information").value;
            
            if (!/^\d{10}$/.test(contactInfo)) {
                alert("Contact number must be exactly 10 digits.");
                return false;
            }
            
            return true;
        }
    </script>

</body>
</html>
